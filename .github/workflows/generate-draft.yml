name: Generate Draft Article

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Article topic (e.g. "Building CLI tools with Node.js")'
        required: true
        type: string
      tags:
        description: 'Comma-separated tags (e.g. "nodejs,cli,tutorial") - optional'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: generate-draft
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate draft article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-draft.mjs --topic "${{ github.event.inputs.topic }}" --tags "${{ github.event.inputs.tags }}"

      - name: Commit generated draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/drafts/
          git diff --staged --quiet && echo "No new files to commit" && exit 0
          git commit -m "draft: generate article on '${{ github.event.inputs.topic }}'"
          git push
